name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore GitHubRefollow.slnx
      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          dotnet build GitHubRefollow.slnx --configuration Release --no-restore 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
      - run: dotnet test GitHubRefollow.slnx --configuration Release --no-build
      - run: docker build --tag github-refollow:ci .
      - name: Verify container environment metadata
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' github-refollow:ci > image-env.txt
          grep -Fx 'GITHUB_REFOLLOW_TOKEN=' image-env.txt
          grep -Fx 'GITHUB_REFOLLOW_DRY_RUN=true' image-env.txt
          grep -Fx 'GITHUB_REFOLLOW_DELAY_SECONDS=2' image-env.txt
          grep -Fx 'TZ=Asia/Ho_Chi_Minh' image-env.txt
          if grep -q '^GITHUB_REFOLLOW_API_KEY=' image-env.txt; then
            echo 'GITHUB_REFOLLOW_API_KEY must not be exposed by the image.' >&2
            exit 1
          fi
